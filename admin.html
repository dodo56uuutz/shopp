<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel | MyShop</title>
<link rel="stylesheet" href="css/style.css">
<style>
.admin-wrap{max-width:1000px;margin:30px auto;padding:0 16px}
.admin-tabs{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap}
.admin-tabs button{background:var(--white);border:1px solid var(--border);
  padding:10px 20px;border-radius:8px;cursor:pointer;font-size:15px;font-weight:600}
.admin-tabs button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.tab-content{display:none}
.tab-content.active{display:block}
.form-card{background:var(--white);padding:22px;border-radius:14px;
  box-shadow:0 2px 12px rgba(0,0,0,.06);margin-bottom:24px}
.form-card h3{margin-bottom:16px}
.form-row{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.form-row label{font-size:14px;font-weight:600}
.form-row input,.form-row textarea{padding:11px;border:1px solid var(--border);
  border-radius:8px;font-size:15px;font-family:inherit}
.form-row textarea{resize:vertical;min-height:70px}
.admin-list{display:grid;gap:12px}
.admin-item{background:var(--white);padding:14px;border-radius:12px;
  display:flex;align-items:center;gap:14px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.admin-item img{width:60px;height:60px;object-fit:cover;border-radius:8px}
.admin-item .info{flex:1}
.admin-item .info h4{font-size:16px}
.admin-item .info .price{color:var(--primary);font-weight:700}
.del-btn{background:#ffe5e5;color:#e74c3c;border:none;padding:8px 14px;
  border-radius:8px;cursor:pointer;font-weight:600}
.order-card{background:var(--white);padding:16px;border-radius:12px;
  margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.order-card .order-head{display:flex;justify-content:space-between;
  margin-bottom:8px;font-weight:700}
.order-card ul{list-style:none;font-size:14px;color:#555}
.badge{background:#e8f5e9;color:#2e7d32;padding:2px 10px;border-radius:20px;
  font-size:12px}
</style>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo">🛍️ MyShop</a>
    <nav class="nav">
      <a href="index.html">← Back to Store</a>
    </nav>
  </div>
</header>

<div class="admin-wrap">
  <h1 style="margin-bottom:20px">⚙️ Admin Panel</h1>

  <div class="admin-tabs">
    <button class="active" data-tab="products-tab">📦 Products</button>
    <button data-tab="orders-tab">🧾 Orders</button>
  </div>

  <!-- Products tab -->
  <div id="products-tab" class="tab-content active">
    <div class="form-card">
      <h3>➕ Add New Product</h3>
      <div class="form-row">
        <label>Product Name</label>
        <input type="text" id="p-name" placeholder="e.g. Wireless Headphones">
      </div>
      <div class="form-row">
        <label>Price (MAD)</label>
        <input type="number" id="p-price" placeholder="199">
      </div>
      <div class="form-row">
        <label>Image URL</label>
        <input type="url" id="p-image" placeholder="https://...">
      </div>
      <div class="form-row">
        <label>Description</label>
        <textarea id="p-desc" placeholder="Short product description"></textarea>
      </div>
      <button class="btn-primary" id="add-product-btn">Save Product</button>
    </div>

    <h3 style="margin-bottom:14px">Current Products</h3>
    <div id="admin-products" class="admin-list"></div>
  </div>

  <!-- Orders tab -->
  <div id="orders-tab" class="tab-content">
    <h3 style="margin-bottom:14px">Incoming Orders</h3>
    <div id="admin-orders"></div>
  </div>
</div>

<script type="module" src="js/admin.js"></script>
</body>
</html>
